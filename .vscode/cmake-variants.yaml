buildType:
  default: debug
  description: Build types
  choices:
    debug:
      short: Debug
      long: Include debugging information without optimizations
      buildType: Debug
      settings:
        MEMORY_MANAGER_TEST_SANITIZER: none
    tsan:
      short: RelWithDebInfo+TSan
      long: Perform optimizations with ThreadSanitizer
      buildType: RelWithDebInfo
      settings:
        MEMORY_MANAGER_TEST_SANITIZER: thread
    asan:
      short: RelWithDebInfo+ASan/UBSan
      long: Perform optimizations with AddressSanitizer and UndefinedBehaviorSanitizer
      buildType: RelWithDebInfo
      settings:
        MEMORY_MANAGER_TEST_SANITIZER: address
    release:
      short: Release
      long: Perform optimizations and omit debugging informatin
      buildType: Release
      settings:
        MEMORY_MANAGER_TEST_SANITIZER: none

defaltSettings:
  default: default
  description: ""
  choices:
    default:
      short: "w/Test"
      long: ""
      settings:
        MEMORY_MANAGER_BUILD_TESTS: ON
        DBGROUP_TEST_THREAD_NUM: 8
